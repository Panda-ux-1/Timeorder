const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n), fmt=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`, weekStart=d=>addDays(d,-((d.getDay()+6)%7));let today=new Date(),selected=iso(today),view='week',pageMonth=new Date(today.getFullYear(),today.getMonth(),1),weekOffset=0,starValue=3;

let items=[];try{items=JSON.parse(localStorage.getItem('daymark-items')||'[]')}catch{};const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('daymark-items',JSON.stringify(items))}function dateItems(date){return items.filter(x=>{const due=x.deadline.slice(0,10);return due===date||(x.remindDaily&&date>=iso(today)&&date<due)}).sort((a,b)=>b.stars-a.stars||a.deadline.localeCompare(b.deadline))}function countCourses(day){return sampleCourses.filter(c=>c.day===day).length}

function renderMonth(body){let y=pageMonth.getFullYear(),m=pageMonth.getMonth(),first=new Date(y,m,1),start=weekStart(first),cells=42;$('#calendarTitle').textContent=`${y} 年 ${m+1} 月`;$('#calendarSub').textContent='点击日期查看当天的课程、事项与截止时间';$('#rangeLabel').textContent=`${y}年${pad(m+1)}月`;$('#eyebrow').textContent=`${y} 年 ${m+1} 月 · 月历总览`;body.className='month-wrap';body.innerHTML='<div class="month-grid">'+['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<div class="month-dow">${d}</div>`).join('')+Array.from({length:cells},(_,i)=>{let d=addDays(start,i),key=iso(d),list=dateItems(key),courses=countCourses((d.getDay()+6)%7),labels=[...list.map(t=>({name:t.title,task:true})),...(courses?[{name:`${courses} 节课程`,task:false}]:[])];return `<button class="month-day ${d.getMonth()!==m?'outside':''} ${key===iso(today)?'today':''} ${key===selected?'selected':''}" data-date="${key}"><span class="daynum">${d.getDate()}</span><div class="month-dots">${labels.slice(0,2).map(x=>`<span class="month-dot ${x.task?'taskdot':''}" title="${esc(x.name)}">${esc(x.name)}</span>`).join('')}</div>${labels.length>2?`<div class="more-count">+${labels.length-2} 项</div>`:''}</button>`}).join('')+'</div>';body.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;setView('day')})}

function renderDay(body){let d=parse(selected),dow=(d.getDay()+6)%7,lessons=sampleCourses.filter(c=>c.day===dow);$('#calendarTitle').textContent=fmt(d);$('#calendarSub').textContent='课程不显示具体时间，按当天节次顺序排列';$('#rangeLabel').textContent='当天';$('#eyebrow').textContent=`${['星期一','星期二','星期三','星期四','星期五','星期六','星期日'][dow]} · 日程详情`;body.className='month-wrap';body.innerHTML=`<div class="section-title">今日课程 · ${lessons.length}/5 节</div>${lessons.length?lessons.map((c,i)=>`<div class="day-course" style="border-color:${c.tone};background:${c.tint}"><strong>第 ${i+1} 节 · ${esc(c.name)}</strong><small>${esc(c.meta)}</small></div>`).join(''):'<div class="empty">今天没有课程，享受自由安排的时间。</div>'}<div class="section-title" style="margin-top:18px">事项 · ${dateItems(selected).length} 项</div><div id="dayItems"></div>`;renderTaskList($('#dayItems'),dateItems(selected))}
function renderAgenda(){const d=parse(selected),dow=(d.getDay()+6)%7,lessons=sampleCourses.filter(c=>c.day===dow);$('#agendaTitle').textContent=selected===iso(today)?'今天的安排':'当天的安排';$('#agendaDate').textContent=`${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]} · ${d.getMonth()+1} 月 ${d.getDate()} 日`;$('#agendaCount').textContent=`${lessons.length} 节课 · ${dateItems(selected).length} 项`;$('#dayCourses').innerHTML=lessons.length?lessons.map((c,i)=>`<div class="course-row" style="--tone:${c.tone};--tint:${c.tint}"><strong>第 ${i+1} 节 · ${esc(c.name)}</strong><small>${esc(c.meta)}</small></div>`).join(''):'<div class="empty">当天没有课程</div>';renderTaskList($('#taskList'),dateItems(selected))}
function renderTaskList(root,list){root.innerHTML=list.length?list.map(x=>`<div class="task ${x.done?'done':''}" data-id="${x.id}"><button class="check" aria-label="标记完成"></button><div class="task-body"><div class="task-name">${esc(x.title)}</div><div class="task-meta">截止 ${esc(x.deadline.replace('T',' '))}${x.note?` · ${esc(x.note)}`:''}</div></div><div class="task-tools"><span class="stars" title="${x.stars} 星">${'★'.repeat(x.stars)}${'☆'.repeat(3-x.stars)}</span><button class="edit-btn" aria-label="编辑事项">编辑</button></div></div>`).join(''):'<div class="empty">这一天还没有事项</div>';root.querySelectorAll('.task').forEach(row=>{const item=items.find(x=>x.id===row.dataset.id);row.querySelector('.check').onclick=()=>{item.done=!item.done;persist();render()};row.querySelector('.edit-btn').onclick=()=>openEdit(item)})}
$('#prev').onclick=()=>{if(view==='month')pageMonth=new Date(pageMonth.getFullYear(),pageMonth.getMonth()-1,1);else if(view==='week')weekOffset--;else selected=iso(addDays(parse(selected),-1));render()};$('#next').onclick=()=>{if(view==='month')pageMonth=new Date(pageMonth.getFullYear(),pageMonth.getMonth()+1,1);else if(view==='week')weekOffset++;else selected=iso(addDays(parse(selected),1));render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#todayBtn').onclick=()=>{selected=iso(today);pageMonth=new Date(today.getFullYear(),today.getMonth(),1);weekOffset=0;setView(view)};
const modal=$('#modal');function openEdit(item){$('#itemId').value=item.id;$('#modalTitle').textContent='编辑事项';$('#title').value=item.title;$('#deadline').value=item.deadline;$('#note').value=item.note||'';$('#remindDaily').checked=!!item.remindDaily;setStars(item.stars);$('#deleteBtn').style.visibility='visible';modal.classList.add('open')}function openNew(){ $('#itemForm').reset();$('#itemId').value='';$('#modalTitle').textContent='新建事项';$('#deadline').value=`${selected}T23:59`;setStars(3);$('#deleteBtn').style.visibility='hidden';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function setStars(n){starValue=n;document.querySelectorAll('#importance button').forEach(b=>b.classList.toggle('active',Number(b.dataset.star)===n))}document.querySelectorAll('#importance button').forEach(b=>b.onclick=()=>setStars(Number(b.dataset.star)));$('#addBtn').onclick=openNew;$('#addTask').onclick=openNew;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};$('#itemForm').onsubmit=e=>{e.preventDefault();let id=$('#itemId').value;let data={id:id||crypto.randomUUID(),title:$('#title').value.trim(),deadline:$('#deadline').value,stars:starValue,note:$('#note').value.trim(),remindDaily:$('#remindDaily').checked,done:id?(items.find(x=>x.id===id)?.done||false):false};if(id)items=items.map(x=>x.id===id?data:x);else items.push(data);selected=data.deadline.slice(0,10);persist();closeModal();if(view==='month')setView('month');else render();toast(id?'事项已更新':'事项已添加')};$('#deleteBtn').onclick=()=>{let id=$('#itemId').value;if(id&&confirm('确定删除这条事项吗？')){items=items.filter(x=>x.id!==id);persist();closeModal();render();toast('事项已删除')}};let timer;function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}
function coursesOn(date){return window.importedCourses.filter(c=>c.date===date&&c.date>=iso(today)).sort((a,b)=>a.periods[0]-b.periods[0]||a.name.localeCompare(b.name,'zh-CN'))}
function courseButton(c,extra='',grid=''){const tone=c.kind==='实验/见习'?'#bd9663':'#728c83',tint=c.kind==='实验/见习'?'#f6f1e8':'#edf2ef';return `<button class="lesson course-button ${extra}" style="--tone:${tone};--tint:${tint};${grid}" data-course-id="${c.id}" title="点击查看课程详情">${esc(c.name)}</button>`}
function openConflict(ids,date,period){const matches=ids.map(id=>window.importedCourses.find(c=>c.id===id)).filter(Boolean);$('#conflictDetail').innerHTML=`<div class="section-title">${esc(date)} · 第 ${period} 节 · ${matches.length} 门课程</div>`+matches.map(c=>`<div class="conflict-course"><strong>${esc(c.name)}</strong><p>课程：${esc(c.subject)}<br>节次：${esc(c.original)}<br>教师：${esc(c.teacher)} · 地点：${esc(c.place)}<br>班级：${esc(c.group)}</p><button class="cancel conflict-edit" data-course-id="${c.id}">编辑这门课程</button></div>`).join('');$('#conflictModal').classList.add('open');$('#conflictDetail').querySelectorAll('.conflict-edit').forEach(b=>b.onclick=()=>{const id=b.dataset.courseId;$('#conflictModal').classList.remove('open');openCourseEditor(id)})}
$('#closeConflictModal').onclick=$('#conflictDone').onclick=()=>$('#conflictModal').classList.remove('open');$('#conflictModal').onclick=e=>{if(e.target===$('#conflictModal'))$('#conflictModal').classList.remove('open')};
function openCourse(id){const c=window.importedCourses.find(x=>x.id===id);if(!c)return;window.currentCourseId=id;$('#courseModalTitle').textContent=c.name;const date=parse(c.date);const rows=[['所属课程',c.subject],['本次内容',c.topic],['日期',`${fmt(date)} · ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][date.getDay()]}`],['节次',c.original],['课程类型',c.kind],['授课教师',c.teacher],['地点',c.place],['教学组别',c.group],['来源文件',c.source]];$('#courseDetail').innerHTML=rows.map(r=>`<div class="course-detail-row"><b>${r[0]}</b>${esc(r[1])}</div>`).join('');$('#courseModal').classList.add('open')}
$('#closeCourseModal').onclick=$('#courseModalDone').onclick=()=>$('#courseModal').classList.remove('open');$('#courseModal').onclick=e=>{if(e.target===$('#courseModal'))$('#courseModal').classList.remove('open')};

function openCourseEditor(id='',date=selected,periods=[1]){const c=window.importedCourses.find(x=>x.id===id);$('#courseId').value=c?.id||'';$('#courseEditorTitle').textContent=c?'编辑课程':'新增课程';$('#courseSubject').value=c?.subject||'';$('#courseDate').value=c?.date||date;renderCoursePeriodChoices(c?.periods||periods);$('#courseKind').value=c?.kind||'理论';$('#courseTopic').value=c?.topic||'';$('#courseTeacher').value=c?.teacher==='未注明'?'':c?.teacher||'';$('#coursePlace').value=c?.place==='未注明'?'':c?.place||'';$('#courseGroup').value=c?.group||'宗濂班';$('#courseEditor').classList.add('open')}

$('#courseForm').onsubmit=e=>{e.preventDefault();const id=$('#courseId').value,old=window.importedCourses.find(x=>x.id===id),subject=$('#courseSubject').value.trim(),periods=[...$('#coursePeriodChoices').querySelectorAll('input:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b),kind=$('#courseKind').value,original=periods.map(n=>`第${n}节`).join('、'),item={id:old?.id||`manual-${Date.now()}`,date:$('#courseDate').value,periods,name:kind==='理论'?subject:`${subject}（实验）`,topic:$('#courseTopic').value.trim(),subject,teacher:$('#courseTeacher').value.trim()||'未注明',place:$('#coursePlace').value.trim()||'未注明',group:$('#courseGroup').value.trim()||'宗濂班',kind,original,source:old?.source||'手动添加'};if(!periods.length){toast('请至少选择一节课');return}if(old)window.importedCourses=window.importedCourses.map(x=>x.id===id?item:x);else window.importedCourses.push(item);window.persistImportedCourses();selected=item.date;const chosen=parse(item.date);weekOffset=Math.round((weekStart(chosen)-weekStart(today))/86400000/7);pageMonth=new Date(chosen.getFullYear(),chosen.getMonth(),1);closeCourseEditor();render();toast(old?'课程已更新':'课程已添加')};
$('#courseDeleteBtn').onclick=()=>{const id=window.currentCourseId,c=window.importedCourses.find(x=>x.id===id);if(c&&confirm(`删除“${c.name}”这节课？`)){window.importedCourses=window.importedCourses.filter(x=>x.id!==id);window.persistImportedCourses();$('#courseModal').classList.remove('open');render();toast('课程已删除')}};
renderMonth=function(body){const y=pageMonth.getFullYear(),m=pageMonth.getMonth(),first=new Date(y,m,1),start=weekStart(first);$('#calendarTitle').textContent=`${y} 年 ${m+1} 月`;$('#calendarSub').textContent='点击日期查看当天事项';$('#rangeLabel').textContent=`${y}年${pad(m+1)}月`;$('#eyebrow').textContent=`${y} 年 ${m+1} 月 · 月历总览`;body.className='month-wrap';body.innerHTML='<div class="month-grid">'+['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<div class="month-dow">${d}</div>`).join('')+Array.from({length:42},(_,i)=>{const d=addDays(start,i),key=iso(d),list=items.filter(t=>t.deadline.slice(0,10)===key).sort((a,b)=>b.stars-a.stars||a.deadline.localeCompare(b.deadline)),labels=list.slice(0,2).map(t=>({name:t.title,task:true}));return `<button class="month-day ${d.getMonth()!==m?'outside':''} ${key===iso(today)?'today':''} ${key===selected?'selected':''}" data-date="${key}"><span class="daynum">${d.getDate()}</span><div class="month-dots">${labels.slice(0,2).map(x=>`<span class="month-dot ${x.task?'taskdot':''}" title="${esc(x.name)}">${esc(x.name)}</span>`).join('')}</div>${list.length>2?`<div class="more-count">+${list.length-2} 项</div>`:''}</button>`}).join('')+'</div>';body.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;setView('day')})};
renderWeek=function(body){const start=addDays(weekStart(today),weekOffset*7),end=addDays(start,6);$('#calendarTitle').textContent='周课表';$('#calendarSub').textContent=`${fmt(start)} — ${fmt(end)}`;$('#rangeLabel').textContent=weekOffset===0?'本周':`${Math.abs(weekOffset)} 周${weekOffset<0?'前':'后'}`;$('#eyebrow').textContent='一周课程 · 每天最多十节';body.className='';body.innerHTML='<div class="fivegrid">'+Array.from({length:7},(_,i)=>{const d=addDays(start,i),key=iso(d),cs=coursesOn(key);return `<div class="week-day ${key===iso(today)?'today':''}" data-date="${key}"><div class="week-head">${['周一','周二','周三','周四','周五','周六','周日'][i]}<b>${d.getDate()}</b></div>${(()=>{const slots=Array.from({length:10},(_,j)=>cs.filter(c=>c.periods.includes(j+1))),cells=[];for(let j=0;j<10;){const list=slots[j];if(list.length>1){cells.push(`<button class="lesson course-conflict" style="grid-row:${j+2}" data-conflict-ids="${list.map(c=>c.id).join(',')}" data-conflict-date="${key}" data-conflict-period="${j+1}">课程冲突<small>${list.length} 门课程</small></button>`);j++}else if(list.length===1){let span=1;while(j+span<10&&slots[j+span].length===1&&slots[j+span][0].name===list[0].name)span++;cells.push(courseButton(list[0],span>1?'merged-course':'',`grid-row:${j+2} / span ${span}`));j+=span}else{cells.push(`<button type="button" class="lesson empty-slot empty-course-slot" style="grid-row:${j+2}" data-empty-date="${key}" data-empty-period="${j+1}" title="点击添加第 ${j+1} 节课程">空</button>`);j++}}return cells.join('')})()}</div>`}).join('')+'</div>';body.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;setView('day')});body.querySelectorAll('[data-course-id]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCourse(b.dataset.courseId)});body.querySelectorAll('[data-conflict-ids]').forEach(b=>b.onclick=e=>{e.stopPropagation();openConflict(b.dataset.conflictIds.split(','),b.dataset.conflictDate,Number(b.dataset.conflictPeriod))});body.querySelectorAll('[data-empty-period]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCourseEditor('',b.dataset.emptyDate,[Number(b.dataset.emptyPeriod)])})};
renderDay=function(body){const d=parse(selected),cs=coursesOn(selected);$('#calendarTitle').textContent=fmt(d);$('#calendarSub').textContent='点击课程名称查看教师、地点、分组和来源';$('#rangeLabel').textContent='当天';$('#eyebrow').textContent=`${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]} · 日程详情`;body.className='month-wrap';body.innerHTML=`<div class="section-title">当天课程 · ${cs.length} 节</div>${cs.length?cs.map(c=>`<button class="day-course course-button" data-course-id="${c.id}"><strong>第 ${c.periods.join('、')} 节 · ${esc(c.name)}</strong><small>${esc(c.subject)} · ${esc(c.original)}</small></button>`).join(''):'<div class="empty">今天没有课程，享受自由安排的时间。</div>'}<div class="section-title" style="margin-top:18px">事项 · ${dateItems(selected).length} 项</div><div id="dayItems"></div>`;renderTaskList($('#dayItems'),dateItems(selected));body.querySelectorAll('[data-course-id]').forEach(b=>b.onclick=()=>openCourse(b.dataset.courseId))};
renderDay=function(body){const d=parse(selected);$('#calendarTitle').textContent=fmt(d);$('#calendarSub').textContent='查看并管理当天事项';$('#rangeLabel').textContent='当天';$('#eyebrow').textContent=`${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]} · 事项清单`;body.className='month-wrap';body.innerHTML=`<div class="section-title">当天事项 · ${dateItems(selected).length} 项</div><div id="dayItems"></div>`;renderTaskList($('#dayItems'),dateItems(selected))};
renderAgenda=function(){const d=parse(selected);$('#agendaTitle').textContent=selected===iso(today)?'今天的安排':'当天的安排';$('#agendaDate').textContent=`${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]} · ${d.getMonth()+1} 月 ${d.getDate()} 日`;$('#agendaCount').textContent=`${dateItems(selected).length} 项事项`;renderTaskList($('#taskList'),dateItems(selected))};
const renderWithCourseCount=render;render=function(){renderWithCourseCount();const start=weekStart(today),n=Array.from({length:7},(_,i)=>coursesOn(iso(addDays(start,i))).length).reduce((a,b)=>a+b,0);$('#courseStat').innerHTML=`${n} <span style="font-size:11px;font-weight:400;color:#8f958d">节</span>`};
pageMonth=new Date(today.getFullYear(),today.getMonth(),1);selected=iso(today);if(today.getDay()===0){weekOffset=1;selected=iso(addDays(today,1))}render();
